; ==========================================================
;  QuickLaunch for AutoHotkey v2 + WebView2
;  AHK 侧配置（假面：窗口 / 热键 / 行为）
;  应用条目请编辑同目录下的 config.json
; ==========================================================

[General]
; 全局热键（AutoHotkey 语法）：^!Space = Ctrl+Alt+Space，也可写 #Space / ^+F12
Hotkey=^!Space

; 窗口尺寸（像素）
Width=820
Height=580

; 窗口圆角（0 = 直角，直角时系统会保留窗口阴影）
CornerRadius=14

; 始终置顶
AlwaysOnTop=1

; 失去焦点自动隐藏（1 开启，0 关闭）
HideOnBlur=0

; 启动应用后自动隐藏启动器
HideAfterLaunch=1

; 启动时立即显示界面（1 便于调试，0 只在按热键时出现）
ShowOnStart=1

; 允许 F12 打开开发者工具 / 右键菜单（调试用）
DevTools=1
